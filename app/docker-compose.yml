# Docker Compose for Coolify (and plain `docker compose up`).
#
# Services:
#   app — the React SPA + API server (auth, subscription, model proxy)
#   db  — PostgreSQL for users / subscriptions / usage
#
# In Coolify: create a "Docker Compose" resource pointing at this file and set
# the environment variables (JWT_SECRET, POSTGRES_PASSWORD, NABUGATE_URL, …) in
# the Coolify UI. Coolify maps your domain to the app container's port 3000.
#
# To reach a NabuGate that runs as a separate Coolify resource, set NABUGATE_URL
# to its internal address (e.g. http://nabugate:8080) and attach this stack to
# that service's network — see the commented `networks` block at the bottom.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Only needed if the SPA is served from a different origin than the API.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Cross-origin frontend? Set CORS_ORIGIN to its URL and COOKIE_SAMESITE=none.
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      # Discrete connection fields (no DATABASE_URL) so passwords with special
      # characters like / + = don't need URL-encoding.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-mrc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mrc}
      POSTGRES_DB: ${POSTGRES_DB:-mrc}
      JWT_SECRET: ${JWT_SECRET:?set a long random JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Admins (comma-separated emails) + which models the free plan may use.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      FREE_MODEL_IDS: ${FREE_MODEL_IDS:-nabu-fast}
      # NabuGate (internal OpenAI-compatible gateway) — address + port you provide.
      NABUGATE_URL: ${NABUGATE_URL:-}
      NABUGATE_API_KEY: ${NABUGATE_API_KEY:-}
      NABUGATE_MODEL: ${NABUGATE_MODEL:-nabu-fast}
      # Optional direct Anthropic fallback when NABUGATE_URL is unset.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Billing: manual (demo, activates instantly) or zibal (real gateway).
      BILLING_PROVIDER: ${BILLING_PROVIDER:-manual}
      ZIBAL_MERCHANT: ${ZIBAL_MERCHANT:-}
      # Public URL of THIS app (for the Zibal callback + return redirect), e.g.
      # https://gpt.example.com — required when BILLING_PROVIDER=zibal.
      APP_BASE_URL: ${APP_BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mrc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mrc}
      POSTGRES_DB: ${POSTGRES_DB:-mrc}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mrc} -d ${POSTGRES_DB:-mrc}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
# To connect to a NabuGate running elsewhere on a shared Docker network,
# uncomment and set the network name, then add `networks: [default, nabugate]`
# to the `app` service above.
# networks:
#   nabugate:
#     external: true
#     name: coolify
